openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Valo API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: daily-logs
    description: Daily health metric logs
  - name: moods
    description: Mood entries
  - name: goals
    description: User goals
  - name: habits
    description: Daily habits
  - name: insights
    description: AI insight cards
  - name: log-entries
    description: Activity log entries
  - name: dashboard
    description: Dashboard data
  - name: calendar-events
    description: Calendar events and goal deadlines
  - name: onboarding
    description: Onboarding flow status and progressive field save
  - name: settings
    description: User settings and preferences
  - name: analyze-image
    description: AI image analysis via Claude vision
  - name: profile
    description: User profile and streak data
  - name: personal-dates
    description: Personal recurring dates (birthdays, anniversaries)
  - name: exercises
    description: Exercise library — list, archive, and unarchive exercises
  - name: workout
    description: Workout sessions, set logging, coaching, PR tracking, and volume trends
  - name: action-proposals
    description: Agentic action proposals — execute, dismiss, and undo
  - name: buddies
    description: Accountability buddy relationships and the buddy-facing view
  - name: shared-commitments
    description: Shared accountability commitments and their participants
  - name: commitment-exceptions
    description: Planned pauses and excused absences that keep streaks alive
  - name: encouragements
    description: Buddy support taps on shared commitments
  - name: accountability
    description: Merged accountability activity feed
  - name: meal-plans
    description: AI-powered training-aware meal plans, ingredient swaps, and shopping/prep lists
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /daily-logs/today:
    get:
      operationId: getTodayLog
      tags: [daily-logs]
      summary: Get today's daily log for the authenticated user
      responses:
        "200":
          description: Today's daily log (may be null if not yet created)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyLogOrNull"

  /daily-logs/history:
    get:
      operationId: listDailyLogHistory
      tags: [daily-logs]
      summary: Get daily logs for the authenticated user, optionally filtered by date range
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
            format: date
          description: "ISO date (YYYY-MM-DD). When provided, return all logs on or after this date. When omitted, defaults to the last 30 days."
        - in: query
          name: endDate
          schema:
            type: string
            format: date
          description: "ISO date (YYYY-MM-DD). When provided, return all logs on or before this date. Defaults to today."
      responses:
        "200":
          description: List of daily logs ordered by date descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyLog"

  /daily-logs:
    post:
      operationId: upsertDailyLog
      tags: [daily-logs]
      summary: Create or update today's daily log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyLogInput"
      responses:
        "200":
          description: Updated daily log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyLog"

  /moods:
    get:
      operationId: listMoods
      tags: [moods]
      summary: List recent mood entries (last 7 days)
      responses:
        "200":
          description: List of mood entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MoodEntry"
    post:
      operationId: createMood
      tags: [moods]
      summary: Log a mood entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoodInput"
      responses:
        "201":
          description: Created mood entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodEntry"

  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List goals
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}:
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "404":
          description: Not found
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /calendar-events:
    get:
      operationId: listCalendarEvents
      tags: [calendar-events]
      summary: List calendar events
      responses:
        "200":
          description: List of calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
    post:
      operationId: createCalendarEvent
      tags: [calendar-events]
      summary: Create a calendar event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventInput"
      responses:
        "201":
          description: Created calendar event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"

  /calendar-events/{id}:
    patch:
      operationId: updateCalendarEvent
      tags: [calendar-events]
      summary: Update a calendar event (recurrence fields, deletedOccurrences, etc.)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventUpdate"
      responses:
        "200":
          description: Updated calendar event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
        "404":
          description: Not found
    delete:
      operationId: deleteCalendarEvent
      tags: [calendar-events]
      summary: Delete a calendar event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /habits:
    get:
      operationId: listHabits
      tags: [habits]
      summary: List habits
      responses:
        "200":
          description: List of habits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Habit"
    post:
      operationId: createHabit
      tags: [habits]
      summary: Create a habit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitInput"
      responses:
        "201":
          description: Created habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"

  /habits/{id}:
    patch:
      operationId: updateHabit
      tags: [habits]
      summary: Update a habit (toggle completion, edit name, etc.)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitUpdate"
      responses:
        "200":
          description: Updated habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "404":
          description: Not found
    delete:
      operationId: deleteHabit
      tags: [habits]
      summary: Delete a habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /insights:
    get:
      operationId: listInsights
      tags: [insights]
      summary: List insight cards (cached 24h)
      responses:
        "200":
          description: List of insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InsightEntry"

  /insights/refresh:
    post:
      operationId: refreshInsights
      tags: [insights]
      summary: Force-regenerate today's insights
      responses:
        "200":
          description: Newly generated insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InsightEntry"

  /insights/patterns:
    get:
      operationId: listInsightPatterns
      tags: [insights]
      summary: List detected correlation patterns for the user
      responses:
        "200":
          description: Active insight patterns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InsightPattern"

  /log-entries/history:
    get:
      operationId: listLogEntryHistory
      tags: [log-entries]
      summary: Get last 30 days of log entries for the authenticated user
      responses:
        "200":
          description: List of log entries ordered by date descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"

  /log-entries:
    get:
      operationId: listLogEntries
      tags: [log-entries]
      summary: List today's log entries
      responses:
        "200":
          description: List of log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"
    post:
      operationId: createLogEntry
      tags: [log-entries]
      summary: Create a log entry (workout, meal, mood check, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogEntryInput"
      responses:
        "201":
          description: Created log entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogEntry"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get today dashboard data (pillar scores and metrics)
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  /profile/streak:
    get:
      operationId: getStreakData
      tags: [profile]
      summary: Get current and all-time longest streak for the authenticated user
      responses:
        "200":
          description: Streak data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakData"

  /onboarding/status:
    get:
      operationId: getOnboardingStatus
      tags: [onboarding]
      summary: Get the current user's onboarding and first-call completion flags
      responses:
        "200":
          description: Onboarding status flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"

  /onboarding/save:
    patch:
      operationId: saveOnboarding
      tags: [onboarding]
      summary: Save any subset of onboarding fields (called progressively per step)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingSaveInput"
      responses:
        "200":
          description: Saved successfully
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get authenticated user settings
      responses:
        "200":
          description: User settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update authenticated user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettings"
      responses:
        "200":
          description: Updated successfully
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean

  /analyze-image:
    post:
      operationId: analyzeImage
      tags: [analyze-image]
      summary: Analyze an uploaded image with AI (Claude vision)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeImageInput"
      responses:
        "200":
          description: AI analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeImageResult"

  /routines:
    get:
      operationId: listRoutines
      tags: [habits]
      summary: List all routines for the authenticated user
      responses:
        "200":
          description: List of routines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Routine"
    post:
      operationId: createRoutine
      tags: [habits]
      summary: Create or upsert a routine (idempotent by id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutineInput"
      responses:
        "201":
          description: Created routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Routine"

  /routines/{id}:
    patch:
      operationId: updateRoutine
      tags: [habits]
      summary: Update a routine
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutineUpdate"
      responses:
        "200":
          description: Updated routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Routine"
        "404":
          description: Not found
    delete:
      operationId: deleteRoutine
      tags: [habits]
      summary: Delete a routine
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /habit-completions/{date}:
    get:
      operationId: listHabitCompletions
      tags: [habits]
      summary: List habit completions for a specific date (YYYY-MM-DD)
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of habit completions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitCompletion"

  /reminders:
    get:
      operationId: listReminders
      tags: [habits]
      summary: List reminders for the authenticated user, optionally filtered by entity
      parameters:
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
          description: "Filter by entity type (e.g. 'event' or 'routine')"
        - name: entity_id
          in: query
          required: false
          schema:
            type: string
          description: "Filter by entity ID stored in metadata.entityId"
      responses:
        "200":
          description: List of reminders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
    post:
      operationId: upsertReminder
      tags: [habits]
      summary: Create or update a reminder (upserts by userId + type + metadata.habitId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderInput"
      responses:
        "200":
          description: Upserted reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"

  /reminders/{id}:
    patch:
      operationId: updateReminder
      tags: [habits]
      summary: Partially update a reminder (e.g. toggle isActive)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderUpdate"
      responses:
        "200":
          description: Updated reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "404":
          description: Not found
    delete:
      operationId: deleteReminder
      tags: [habits]
      summary: Delete a reminder by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /habit-completions/toggle:
    post:
      operationId: toggleHabitCompletion
      tags: [habits]
      summary: Toggle a habit completion for a specific date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleHabitCompletionInput"
      responses:
        "200":
          description: Toggled completion (updated existing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitCompletion"
        "201":
          description: Toggled completion (created new)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitCompletion"

  /catch-up:
    get:
      operationId: getCatchUp
      tags: [habits]
      summary: Pending Verify items over a bounded lookback window (habits + routines)
      responses:
        "200":
          description: Catch-up gap summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatchUpResult"

  /verification-events:
    post:
      operationId: recordVerificationEvent
      tags: [habits]
      summary: Record a verification event for a habit or routine (the shared Verify write path)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationEventInput"
      responses:
        "200":
          description: Recorded verification event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationEvent"

  /personal-dates:
    get:
      operationId: listPersonalDates
      tags: [personal-dates]
      summary: List all personal dates for the current user
      responses:
        "200":
          description: List of personal dates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonalDate"
    post:
      operationId: createPersonalDate
      tags: [personal-dates]
      summary: Create a new personal date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalDateInput"
      responses:
        "201":
          description: Created personal date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalDate"

  /personal-dates/{id}:
    patch:
      operationId: updatePersonalDate
      tags: [personal-dates]
      summary: Update a personal date
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalDateUpdate"
      responses:
        "200":
          description: Updated personal date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalDate"
    delete:
      operationId: deletePersonalDate
      tags: [personal-dates]
      summary: Delete a personal date
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /exercises:
    get:
      operationId: listExercises
      tags: [exercises]
      summary: List exercises available to the user
      description: Returns system exercises plus the user's own exercises. Archived exercises are excluded by default.
      parameters:
        - name: includeArchived
          in: query
          schema:
            type: boolean
          description: Include the user's own archived exercises
        - name: search
          in: query
          schema:
            type: string
          description: Case-insensitive name search
        - name: category
          in: query
          schema:
            type: string
          description: Exact category filter
      responses:
        "200":
          description: Exercise list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exercise"

  /exercises/{id}/archive:
    post:
      operationId: archiveExercise
      tags: [exercises]
      summary: Archive a user-owned exercise
      description: Hides the exercise from pickers while preserving all logged set history. Only works on exercises owned by the authenticated user.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Archived exercise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"
        "404":
          description: Not found or not owned by the user

  /exercises/{id}/unarchive:
    post:
      operationId: unarchiveExercise
      tags: [exercises]
      summary: Unarchive a user-owned exercise
      description: Restores the exercise to pickers.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unarchived exercise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"
        "404":
          description: Not found or not owned by the user

  /workout/sessions:
    post:
      operationId: createWorkoutSession
      tags: [workout]
      summary: Start a new workout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutSessionInput"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutSession"
    get:
      operationId: listWorkoutSessions
      tags: [workout]
      summary: List recent sessions
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: Filter by status (in_progress | completed | abandoned)
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutSession"

  /workout/sessions/{id}:
    get:
      operationId: getWorkoutSession
      tags: [workout]
      summary: Get a session with its sets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session with set logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutSessionWithSets"
    patch:
      operationId: updateWorkoutSession
      tags: [workout]
      summary: Update mutable session fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutSessionUpdate"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutSession"

  /workout/sessions/{id}/sets:
    get:
      operationId: listWorkoutSets
      tags: [workout]
      summary: List set logs for a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Set list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutSetLog"
    post:
      operationId: logWorkoutSet
      tags: [workout]
      summary: Log a set within a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutSetLogInput"
      responses:
        "201":
          description: Logged set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutSetLog"

  /workout/sessions/{id}/sets/{setId}:
    delete:
      operationId: deleteWorkoutSet
      tags: [workout]
      summary: Remove a set log
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: setId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /workout/sessions/{id}/coaching:
    get:
      operationId: getWorkoutCoaching
      tags: [workout]
      summary: Get a contextual coaching hint for the current session
      description: Returns a 1-2 sentence observation or null when there is nothing useful to say. Rate-limit calls — once per 3+ sets logged is a good cadence.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Coaching hint (hint is null when nothing useful to say)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutCoachingResponse"

  /workout/sessions/{id}/complete:
    post:
      operationId: completeWorkoutSession
      tags: [workout]
      summary: Finalise a session — detect PRs, generate summary, update memory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Completion result with summary and any new PRs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutCompleteResponse"

  /workout/sessions/{id}/hr:
    post:
      operationId: uploadWorkoutHr
      tags: [workout]
      summary: Upload captured heart-rate samples and compute/store the session HR summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutHrUpload"
      responses:
        "200":
          description: Computed and stored heart-rate summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutHrSummary"

  /workout/exercises/{exerciseId}/prs:
    get:
      operationId: getExercisePrs
      tags: [workout]
      summary: Personal records for an exercise
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PR list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutPersonalRecord"

  /workout/exercises/{exerciseId}/history:
    get:
      operationId: getExerciseHistory
      tags: [workout]
      summary: Recent set history for an exercise across completed sessions
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Set history with session date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutSetLogWithSession"

  /workout/volume:
    get:
      operationId: getWorkoutVolume
      tags: [workout]
      summary: Weekly training volume for the last N weeks
      description: Returns one entry per week that had completed sessions, ordered oldest to newest.
      parameters:
        - name: weeks
          in: query
          schema:
            type: integer
          description: Look-back window in weeks (default 13, max 52)
      responses:
        "200":
          description: Weekly volume series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutVolumeWeek"

  /weekly-recap/trigger:
    post:
      operationId: triggerWeeklyRecap
      tags: [weekly-recap]
      summary: Generate a weekly recap on demand for the authenticated user
      responses:
        "200":
          description: The generated weekly recap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyRecap"

  /weekly-recap/latest:
    get:
      operationId: getWeeklyRecapLatest
      tags: [weekly-recap]
      summary: Get the most recent ready weekly recap for the authenticated user
      responses:
        "200":
          description: The latest ready recap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyRecap"
        "404":
          description: No ready recap found

  /weekly-recap/history:
    get:
      operationId: getWeeklyRecapHistory
      tags: [weekly-recap]
      summary: List recap stubs ordered by weekStart descending
      responses:
        "200":
          description: List of recap stubs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeeklyRecapStub"

  /weekly-recap/{id}:
    get:
      operationId: getWeeklyRecapById
      tags: [weekly-recap]
      summary: Get a full weekly recap by id (owned by the calling user)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The full recap object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyRecap"
        "404":
          description: Not found

  /ask:
    post:
      operationId: askValo
      tags: [ask]
      summary: Ask a natural-language question grounded in the user's own data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: A grounded answer with citations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResponse"

  /action-proposals/{id}/execute:
    post:
      operationId: executeActionProposal
      tags: [action-proposals]
      summary: Execute a pending action proposal, log it, and mark it executed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Action executed; returns the action log id for undo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteActionResponse"
        "404":
          description: Proposal not found
        "409":
          description: Proposal is stale (already responded, expired, or the underlying data moved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaleActionResponse"

  /action-proposals/{id}/dismiss:
    post:
      operationId: dismissActionProposal
      tags: [action-proposals]
      summary: Dismiss a pending action proposal (decline, or mark modified)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DismissActionRequest"
      responses:
        "200":
          description: Proposal dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DismissActionResponse"
        "404":
          description: Proposal not found

  /action-log/{id}/undo:
    post:
      operationId: undoAction
      tags: [action-proposals]
      summary: Undo a previously executed action using its before-snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Action undone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UndoActionResult"
        "404":
          description: Action log entry not found
        "409":
          description: Action already undone

  /buddies/invite:
    post:
      operationId: createBuddyInvite
      tags: [buddies]
      summary: Create a single-use buddy invite code
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuddyInviteInput"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuddyInviteResponse"

  /buddies/accept:
    post:
      operationId: acceptBuddyInvite
      tags: [buddies]
      summary: Accept a buddy invite by code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuddyAcceptInput"
      responses:
        "200":
          description: Invite accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuddyAcceptResponse"
        "400":
          description: Invalid, expired, or already-used code
        "409":
          description: Cannot accept own invite, or already connected

  /buddies:
    get:
      operationId: listBuddies
      tags: [buddies]
      summary: List active buddy relationships
      responses:
        "200":
          description: Active buddies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Buddy"

  /buddies/{id}/block:
    post:
      operationId: blockBuddy
      tags: [buddies]
      summary: Block a buddy relationship
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Blocked
        "404":
          description: Not found

  /buddies/{buddyRelationshipId}/commitments:
    get:
      operationId: listBuddyCommitments
      tags: [buddies]
      summary: List commitments a buddy has shared with me (scope-enforced)
      parameters:
        - name: buddyRelationshipId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Shared commitments visible to me
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BuddyCommitmentView"
        "404":
          description: Relationship not found or inactive

  /shared-commitments:
    get:
      operationId: listSharedCommitments
      tags: [shared-commitments]
      summary: List my shared commitments with participant summary
      responses:
        "200":
          description: My commitments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SharedCommitmentWithParticipants"
    post:
      operationId: createSharedCommitment
      tags: [shared-commitments]
      summary: Create a shared commitment (habit-backed in Stage 0)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedCommitmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedCommitment"
        "400":
          description: Invalid input or source not owned by user

  /shared-commitments/{id}/participants:
    post:
      operationId: addCommitmentParticipant
      tags: [shared-commitments]
      summary: Share a commitment with an active buddy at a scope
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddParticipantInput"
      responses:
        "201":
          description: Participant added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitmentParticipant"
        "400":
          description: Invalid scope or relationship not active
        "404":
          description: Commitment not found

  /shared-commitments/{id}/participants/{participantId}:
    delete:
      operationId: removeCommitmentParticipant
      tags: [shared-commitments]
      summary: Revoke a participant's access (silent — no buddy notification)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: participantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Revoked
        "404":
          description: Commitment not found

  /commitment-exceptions:
    post:
      operationId: createCommitmentException
      tags: [commitment-exceptions]
      summary: Declare a pause or excused-absence window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitmentExceptionInput"
      responses:
        "201":
          description: Exception created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitmentException"
        "400":
          description: Invalid kind, scope, or dates
        "404":
          description: Commitment not found

  /shared-commitments/{id}/exceptions:
    get:
      operationId: listCommitmentExceptions
      tags: [commitment-exceptions]
      summary: Exceptions affecting one commitment, newest first
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Exceptions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommitmentException"
        "404":
          description: Commitment not found

  /encouragements:
    post:
      operationId: createEncouragement
      tags: [encouragements]
      summary: Send a one-tap support encouragement (one per buddy/commitment/day)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncouragementInput"
      responses:
        "201":
          description: Encouragement sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Encouragement"
        "400":
          description: Invalid request or own commitment
        "403":
          description: Not a buddy on this commitment
        "404":
          description: Commitment not found
        "409":
          description: Already encouraged this today

  /meal-plans:
    post:
      operationId: createMealPlan
      tags: [meal-plans]
      summary: Generate and persist an AI meal plan from wizard inputs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealPlanInput"
      responses:
        "201":
          description: Created meal plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPlanFull"

  /meal-plans/{id}:
    get:
      operationId: getMealPlan
      tags: [meal-plans]
      summary: Get a meal plan with all day types, meals, and ingredients
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Full meal plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPlanFull"
        "404":
          description: Not found

  /meal-plans/{id}/meals/{mealId}/swap:
    post:
      operationId: swapMealSlot
      tags: [meal-plans]
      summary: Macro-constrained swap for a meal slot or ingredient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: mealId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealSwapInput"
      responses:
        "200":
          description: Updated meal slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealSlotFull"
        "404":
          description: Not found

  /meal-plans/{id}/prep-list:
    get:
      operationId: getMealPlanPrepList
      tags: [meal-plans]
      summary: Weekly prep and shopping list (derived, not stored)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Prep and shopping list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrepListResponse"
        "404":
          description: Not found

  /user-diet-preferences:
    get:
      operationId: getUserDietPreferences
      tags: [meal-plans]
      summary: Get saved diet preferences for the authenticated user
      responses:
        "200":
          description: Diet preferences (may be empty/defaults if never saved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDietPreferences"
    put:
      operationId: putUserDietPreferences
      tags: [meal-plans]
      summary: Create or replace diet preferences for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserDietPreferencesInput"
      responses:
        "200":
          description: Saved diet preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDietPreferences"

  /accountability/feed:
    get:
      operationId: getAccountabilityFeed
      tags: [accountability]
      summary: Merged, newest-first activity feed (cursor-paginated)
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: ISO timestamp of the last item from the previous page
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Feed page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountabilityFeed"

components:
  schemas:
    WeeklyRecapSection:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
        body:
          type: string
        delta:
          type: ["number", "null"]

    WeeklyRecapNarrative:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyRecapSection"
        closing:
          type: ["string", "null"]

    WeeklyRecap:
      type: object
      required: [id, userId, weekStart, weekEnd, generatedAt, workoutsCompleted, debriefCount, nutritionDaysLogged, isQuietWeek, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        weekStart:
          type: string
        weekEnd:
          type: string
        generatedAt:
          type: string
        avgMood:
          type: ["number", "null"]
        avgSleep:
          type: ["number", "null"]
        avgHrv:
          type: ["number", "null"]
        avgSteps:
          type: ["number", "null"]
        avgEnergy:
          type: ["number", "null"]
        pillarSleep:
          type: ["number", "null"]
        pillarMovement:
          type: ["number", "null"]
        pillarWork:
          type: ["number", "null"]
        pillarMindset:
          type: ["number", "null"]
        pillarRelationships:
          type: ["number", "null"]
        workoutsCompleted:
          type: integer
        habitsCompletionPct:
          type: ["number", "null"]
        debriefCount:
          type: integer
        nutritionDaysLogged:
          type: integer
        headline:
          type: ["string", "null"]
        valoInsight:
          type: ["string", "null"]
        narrativeJson:
          oneOf:
            - $ref: "#/components/schemas/WeeklyRecapNarrative"
            - type: "null"
        patternsSnapshot:
          type: ["array", "null"]
          items:
            type: string
        topWin:
          type: ["string", "null"]
        topStruggle:
          type: ["string", "null"]
        intentionNextWeek:
          type: ["string", "null"]
        isQuietWeek:
          type: boolean
        status:
          type: string
        modelUsed:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    WeeklyRecapStub:
      type: object
      required: [id, weekStart, weekEnd, isQuietWeek, status]
      properties:
        id:
          type: integer
        weekStart:
          type: string
        weekEnd:
          type: string
        headline:
          type: ["string", "null"]
        isQuietWeek:
          type: boolean
        status:
          type: string

    AskTurn:
      type: object
      required: [question, answer]
      properties:
        question:
          type: string
        answer:
          type: string

    AskRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
        priorTurns:
          type: array
          items:
            $ref: "#/components/schemas/AskTurn"

    AskCitation:
      type: object
      required: [source, date, excerpt]
      properties:
        source:
          type: string
        date:
          type: string
        excerpt:
          type: string

    AskResponse:
      type: object
      required: [answer, citations]
      properties:
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/AskCitation"

    UserSettings:
      type: object
      required: [callsEnabled, onboardingCompleted, firstCallCompleted, checkinReminderEnabled]
      properties:
        phoneNumber:
          type: ["string", "null"]
        preferredCallTime:
          type: ["string", "null"]
        callTimezone:
          type: ["string", "null"]
        callsEnabled:
          type: boolean
        name:
          type: ["string", "null"]
        lifePriorities:
          type: ["string", "null"]
        onboardingCompleted:
          type: boolean
        firstCallCompleted:
          type: boolean
        expoPushToken:
          type: ["string", "null"]
        checkinReminderEnabled:
          type: boolean
        notifMorning:
          type: boolean
        notifCheckin:
          type: boolean
        notifHabits:
          type: boolean
        notifGoals:
          type: boolean
        morningBriefingTime:
          type: ["string", "null"]
        maxHeartRate:
          type: ["integer", "null"]
        weightKg:
          type: ["integer", "null"]
        age:
          type: ["integer", "null"]
        biologicalSex:
          type: ["string", "null"]

    UpdateSettings:
      type: object
      properties:
        phoneNumber:
          type: ["string", "null"]
        preferredCallTime:
          type: ["string", "null"]
        callTimezone:
          type: ["string", "null"]
        callsEnabled:
          type: boolean
        name:
          type: ["string", "null"]
        lifePriorities:
          type: ["string", "null"]
        expoPushToken:
          type: ["string", "null"]
        checkinReminderEnabled:
          type: boolean
        notifMorning:
          type: boolean
        notifCheckin:
          type: boolean
        notifHabits:
          type: boolean
        notifGoals:
          type: boolean
        morningBriefingTime:
          type: ["string", "null"]
        maxHeartRate:
          type: ["integer", "null"]
        weightKg:
          type: ["integer", "null"]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DailyLog:
      type: object
      required: [id, userId, date]
      properties:
        id:
          type: integer
        userId:
          type: string
        date:
          type: string
        sleepHours:
          type: ["number", "null"]
        hrv:
          type: ["integer", "null"]
        restingHeartRate:
          type: ["integer", "null"]
        steps:
          type: ["integer", "null"]
        activeCalories:
          type: ["integer", "null"]
        respiratoryRate:
          type: ["integer", "null"]
        workoutType:
          type: ["string", "null"]
        workoutDuration:
          type: ["integer", "null"]
        workoutEffort:
          type: ["integer", "null"]

    DailyLogOrNull:
      oneOf:
        - $ref: "#/components/schemas/DailyLog"
        - type: "null"

    DailyLogInput:
      type: object
      properties:
        date:
          type: string
          description: "Target date in YYYY-MM-DD format. Defaults to today when omitted."
        sleepHours:
          type: ["number", "null"]
        hrv:
          type: ["integer", "null"]
        restingHeartRate:
          type: ["integer", "null"]
        steps:
          type: ["integer", "null"]
        activeCalories:
          type: ["integer", "null"]
        respiratoryRate:
          type: ["integer", "null"]
        workoutType:
          type: ["string", "null"]
        workoutDuration:
          type: ["integer", "null"]
        workoutEffort:
          type: ["integer", "null"]

    MoodEntry:
      type: object
      required: [id, userId, date, score]
      properties:
        id:
          type: integer
        userId:
          type: string
        date:
          type: string
        score:
          type: integer
        note:
          type: ["string", "null"]

    MoodInput:
      type: object
      required: [score]
      properties:
        score:
          type: integer
        note:
          type: ["string", "null"]

    Goal:
      type: object
      required: [id, userId, title, progressPercent]
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        targetDate:
          type: ["string", "null"]
        progressPercent:
