      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        days:
          type: string
          description: JSON string of day-of-week numbers, e.g. "[0,1,2,3,4]"
        scheduledTime:
          type: ["string", "null"]
        color:
          type: string
        activities:
          type: ["string", "null"]
          description: JSON string of activity name strings
        isDisplayedOnCalendar:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    RoutineInput:
      type: object
      required: [id, name]
      properties:
