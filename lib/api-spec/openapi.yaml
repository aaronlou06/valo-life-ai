    Reminder:
      type: object
      required: [id, userId, type, label, scheduledTime, isActive, createdAt, updatedAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        type:
          type: string
        label:
          type: string
        scheduledTime:
          type: string
          description: "HH:MM 24-hour time string"
        isActive:
          type: boolean
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        createdAt:
          type: string
        updatedAt:
          type: string

    ReminderInput:
      type: object
      required: [type, label, scheduledTime]
      properties:
        type:
          type: string
        label:
          type: string
        scheduledTime:
          type: string
          description: "HH:MM 24-hour time string"
        isActive:
          type: boolean
        metadata:
          type: object
          nullable: true
          additionalProperties: true

    InsightPattern:
      type: object
      required: [id, userId, patternType, metricA, metricB, correlationScore, description, discoveredAt, isActive]
      properties:
        id:
          type: integer
        userId:
          type: string
        patternType:
          type: string
          description: e.g. "sleep_mood", "hrv_mood", "workout_mood"
        metricA:
          type: string
        metricB:
          type: string
        correlationScore:
          type: number
          description: Pearson r value (-1 to 1)
        description:
          type: string
          description: Human-readable pattern description with specific numbers
        discoveredAt:
          type: string
        isActive:
          type: boolean
