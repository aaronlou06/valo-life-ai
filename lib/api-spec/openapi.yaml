openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Valo API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: daily-logs
    description: Daily health metric logs
  - name: moods
    description: Mood entries
  - name: goals
    description: User goals
  - name: habits
    description: Daily habits
  - name: insights
    description: AI insight cards
  - name: log-entries
    description: Activity log entries
  - name: dashboard
    description: Dashboard data
  - name: calendar-events
    description: Calendar events and goal deadlines
  - name: onboarding
    description: Onboarding flow status and progressive field save
  - name: settings
    description: User settings and preferences
  - name: analyze-image
    description: AI image analysis via Claude vision
  - name: profile
    description: User profile and streak data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /daily-logs/today:
    get:
      operationId: getTodayLog
      tags: [daily-logs]
      summary: Get today's daily log for the authenticated user
      responses:
        "200":
          description: Today's daily log (may be null if not yet created)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyLogOrNull"

  /daily-logs/history:
    get:
      operationId: listDailyLogHistory
      tags: [daily-logs]
      summary: Get daily logs for the authenticated user, optionally filtered by date range
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
            format: date
          description: "ISO date (YYYY-MM-DD). When provided, return all logs on or after this date. When omitted, defaults to the last 30 days."
        - in: query
          name: endDate
          schema:
            type: string
            format: date
          description: "ISO date (YYYY-MM-DD). When provided, return all logs on or before this date. Defaults to today."
      responses:
        "200":
          description: List of daily logs ordered by date descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyLog"

  /daily-logs:
    post:
      operationId: upsertDailyLog
      tags: [daily-logs]
      summary: Create or update today's daily log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyLogInput"
      responses:
        "200":
          description: Updated daily log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyLog"

  /moods:
    get:
      operationId: listMoods
      tags: [moods]
      summary: List recent mood entries (last 7 days)
      responses:
        "200":
          description: List of mood entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MoodEntry"
    post:
      operationId: createMood
      tags: [moods]
      summary: Log a mood entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoodInput"
      responses:
        "201":
          description: Created mood entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodEntry"

  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List goals
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}:
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "404":
          description: Not found
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /calendar-events:
    get:
      operationId: listCalendarEvents
      tags: [calendar-events]
      summary: List calendar events
      responses:
        "200":
          description: List of calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
    post:
      operationId: createCalendarEvent
      tags: [calendar-events]
      summary: Create a calendar event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventInput"
      responses:
        "201":
          description: Created calendar event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"

  /calendar-events/{id}:
    delete:
      operationId: deleteCalendarEvent
      tags: [calendar-events]
      summary: Delete a calendar event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /habits:
    get:
      operationId: listHabits
      tags: [habits]
      summary: List habits
      responses:
        "200":
          description: List of habits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Habit"
    post:
      operationId: createHabit
      tags: [habits]
      summary: Create a habit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitInput"
      responses:
        "201":
          description: Created habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"

  /habits/{id}:
    patch:
      operationId: updateHabit
      tags: [habits]
      summary: Update a habit (toggle completion, edit name, etc.)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitUpdate"
      responses:
        "200":
          description: Updated habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "404":
          description: Not found
    delete:
      operationId: deleteHabit
      tags: [habits]
      summary: Delete a habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /insights:
    get:
      operationId: listInsights
      tags: [insights]
      summary: List insight cards (cached 24h)
      responses:
        "200":
          description: List of insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InsightEntry"

  /insights/refresh:
    post:
      operationId: refreshInsights
      tags: [insights]
      summary: Force-regenerate today's insights
      responses:
        "200":
          description: Newly generated insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InsightEntry"

  /insights/patterns:
    get:
      operationId: listInsightPatterns
      tags: [insights]
      summary: List detected correlation patterns for the user
      responses:
        "200":
          description: Active insight patterns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InsightPattern"

  /log-entries/history:
    get:
      operationId: listLogEntryHistory
      tags: [log-entries]
      summary: Get last 30 days of log entries for the authenticated user
      responses:
        "200":
          description: List of log entries ordered by date descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"

  /log-entries:
    get:
      operationId: listLogEntries
      tags: [log-entries]
      summary: List today's log entries
      responses:
        "200":
          description: List of log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"
    post:
      operationId: createLogEntry
      tags: [log-entries]
      summary: Create a log entry (workout, meal, mood check, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogEntryInput"
      responses:
        "201":
          description: Created log entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogEntry"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get today dashboard data (pillar scores and metrics)
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  /profile/streak:
    get:
      operationId: getStreakData
      tags: [profile]
      summary: Get current and all-time longest streak for the authenticated user
      responses:
        "200":
          description: Streak data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakData"

  /onboarding/status:
    get:
      operationId: getOnboardingStatus
      tags: [onboarding]
      summary: Get the current user's onboarding and first-call completion flags
      responses:
        "200":
          description: Onboarding status flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"

  /onboarding/save:
    patch:
      operationId: saveOnboarding
      tags: [onboarding]
      summary: Save any subset of onboarding fields (called progressively per step)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingSaveInput"
      responses:
        "200":
          description: Saved successfully
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get authenticated user settings
      responses:
        "200":
          description: User settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update authenticated user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettings"
      responses:
        "200":
          description: Updated successfully
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean

  /analyze-image:
    post:
      operationId: analyzeImage
      tags: [analyze-image]
      summary: Analyze an uploaded image with AI (Claude vision)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeImageInput"
      responses:
        "200":
          description: AI analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeImageResult"

  /routines:
    get:
      operationId: listRoutines
      tags: [habits]
      summary: List all routines for the authenticated user
      responses:
        "200":
          description: List of routines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Routine"
    post:
      operationId: createRoutine
      tags: [habits]
      summary: Create or upsert a routine (idempotent by id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutineInput"
      responses:
        "201":
          description: Created routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Routine"

  /routines/{id}:
    patch:
      operationId: updateRoutine
      tags: [habits]
      summary: Update a routine
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutineUpdate"
      responses:
        "200":
          description: Updated routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Routine"
        "404":
          description: Not found
    delete:
      operationId: deleteRoutine
      tags: [habits]
      summary: Delete a routine
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /habit-completions/{date}:
    get:
      operationId: listHabitCompletions
      tags: [habits]
      summary: List habit completions for a specific date (YYYY-MM-DD)
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of habit completions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitCompletion"

  /reminders:
    get:
      operationId: listReminders
      tags: [habits]
      summary: List all reminders for the authenticated user
      responses:
        "200":
          description: List of reminders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
    post:
      operationId: upsertReminder
      tags: [habits]
      summary: Create or update a reminder (upserts by userId + type + metadata.habitId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderInput"
      responses:
        "200":
          description: Upserted reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"

  /reminders/{id}:
    delete:
      operationId: deleteReminder
      tags: [habits]
      summary: Delete a reminder by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /habit-completions/toggle:
    post:
      operationId: toggleHabitCompletion
      tags: [habits]
      summary: Toggle a habit completion for a specific date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleHabitCompletionInput"
      responses:
        "200":
          description: Toggled completion (updated existing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitCompletion"
        "201":
          description: Toggled completion (created new)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitCompletion"

components:
  schemas:
    UserSettings:
      type: object
      required: [callsEnabled, onboardingCompleted, firstCallCompleted, checkinReminderEnabled]
      properties:
        phoneNumber:
          type: ["string", "null"]
        preferredCallTime:
          type: ["string", "null"]
        callTimezone:
          type: ["string", "null"]
        callsEnabled:
          type: boolean
        name:
          type: ["string", "null"]
        lifePriorities:
          type: ["string", "null"]
        onboardingCompleted:
          type: boolean
        firstCallCompleted:
          type: boolean
        expoPushToken:
          type: ["string", "null"]
        checkinReminderEnabled:
          type: boolean
        notifMorning:
          type: boolean
        notifCheckin:
          type: boolean
        notifHabits:
          type: boolean
        notifGoals:
          type: boolean
        morningBriefingTime:
          type: ["string", "null"]

    UpdateSettings:
      type: object
      properties:
        phoneNumber:
          type: ["string", "null"]
        preferredCallTime:
          type: ["string", "null"]
        callTimezone:
          type: ["string", "null"]
        callsEnabled:
          type: boolean
        name:
          type: ["string", "null"]
        lifePriorities:
          type: ["string", "null"]
        expoPushToken:
          type: ["string", "null"]
        checkinReminderEnabled:
          type: boolean
        notifMorning:
          type: boolean
        notifCheckin:
          type: boolean
        notifHabits:
          type: boolean
        notifGoals:
          type: boolean
        morningBriefingTime:
          type: ["string", "null"]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DailyLog:
      type: object
      required: [id, userId, date]
      properties:
        id:
          type: integer
        userId:
          type: string
        date:
          type: string
        sleepHours:
          type: ["number", "null"]
        hrv:
          type: ["integer", "null"]
        restingHeartRate:
          type: ["integer", "null"]
        steps:
          type: ["integer", "null"]
        activeCalories:
          type: ["integer", "null"]
        respiratoryRate:
          type: ["integer", "null"]
        workoutType:
          type: ["string", "null"]
        workoutDuration:
          type: ["integer", "null"]
        workoutEffort:
          type: ["integer", "null"]

    DailyLogOrNull:
      oneOf:
        - $ref: "#/components/schemas/DailyLog"
        - type: "null"

    DailyLogInput:
      type: object
      properties:
        date:
          type: string
          description: "Target date in YYYY-MM-DD format. Defaults to today when omitted."
        sleepHours:
          type: ["number", "null"]
        hrv:
          type: ["integer", "null"]
        restingHeartRate:
          type: ["integer", "null"]
        steps:
          type: ["integer", "null"]
        activeCalories:
          type: ["integer", "null"]
        respiratoryRate:
          type: ["integer", "null"]
        workoutType:
          type: ["string", "null"]
        workoutDuration:
          type: ["integer", "null"]
        workoutEffort:
          type: ["integer", "null"]

    MoodEntry:
      type: object
      required: [id, userId, date, score]
      properties:
        id:
          type: integer
        userId:
          type: string
        date:
          type: string
        score:
          type: integer
        note:
          type: ["string", "null"]

    MoodInput:
      type: object
      required: [score]
      properties:
        score:
          type: integer
        note:
          type: ["string", "null"]

    Goal:
      type: object
      required: [id, userId, title, progressPercent]
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        targetDate:
          type: ["string", "null"]
        progressPercent:
          type: integer
        category:
          type: string
        updatedAt:
          type: ["string", "null"]

    GoalInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
        targetDate:
          type: ["string", "null"]
        progressPercent:
          type: integer
        category:
          type: string
        goalType:
          type: string
        currentValue:
          type: ["integer", "null"]
        targetValue:
          type: ["integer", "null"]
        unit:
          type: ["string", "null"]
        direction:
          type: ["string", "null"]
        xpPoints:
          type: ["integer", "null"]
        currentTier:
          type: ["string", "null"]
        tiers:
          type: ["string", "null"]
        milestones:
          type: ["string", "null"]
        avoidanceLimit:
          type: ["integer", "null"]
        linkedHabitIds:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    GoalUpdate:
      type: object
      properties:
        title:
          type: string
        targetDate:
          type: ["string", "null"]
        progressPercent:
          type: integer
        category:
          type: string
        goalType:
          type: string
        currentValue:
          type: ["integer", "null"]
        targetValue:
          type: ["integer", "null"]
        unit:
          type: ["string", "null"]
        direction:
          type: ["string", "null"]
        xpPoints:
          type: ["integer", "null"]
        currentTier:
          type: ["string", "null"]
        tiers:
          type: ["string", "null"]
        milestones:
          type: ["string", "null"]
        avoidanceLimit:
          type: ["integer", "null"]
        linkedHabitIds:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    CalendarEvent:
      type: object
      required: [id, userId, date, title]
      properties:
        id:
          type: integer
        userId:
          type: string
        date:
          type: string
        title:
          type: string
        startTime:
          type: ["string", "null"]
        endTime:
          type: ["string", "null"]
        type:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    CalendarEventInput:
      type: object
      required: [title, date]
      properties:
        title:
          type: string
        date:
          type: string
        type:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    Habit:
      type: object
      required: [id, userId, name, streak, completedToday]
      properties:
        id:
          type: integer
        userId:
          type: string
        name:
          type: string
        streak:
          type: integer
        completedToday:
          type: boolean
        category:
          type: string
        routineId:
          type: string
          nullable: true

    HabitInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        category:
          type: string
        routineId:
          type: string
          nullable: true

    HabitUpdate:
      type: object
      properties:
        name:
          type: string
        completedToday:
          type: boolean
        streak:
          type: integer
        category:
          type: string
        routineId:
          type: string
          nullable: true

    InsightEntry:
      type: object
      required: [id, userId, date, label, content]
      properties:
        id:
          type: integer
        userId:
          type: string
        date:
          type: string
        label:
          type: string
        content:
          type: string
        followUpQuestion:
          type: ["string", "null"]

    LogEntry:
      type: object
      required: [id, userId, date, type, title]
      properties:
        id:
          type: integer
        userId:
          type: string
        date:
          type: string
        type:
          type: string
        title:
          type: string
        subtitle:
          type: ["string", "null"]
        value:
          type: ["string", "null"]

    LogEntryInput:
      type: object
      required: [type, title]
      properties:
        type:
          type: string
        title:
          type: string
        subtitle:
          type: ["string", "null"]
        value:
          type: ["string", "null"]

    Dashboard:
      type: object
      required: [healthScore, workScore, relationshipScore, healthStatus, workStatus, relationshipStatus, streak]
      properties:
        sleepHours:
          type: ["number", "null"]
        hrv:
          type: ["integer", "null"]
        restingHeartRate:
          type: ["integer", "null"]
        steps:
          type: ["integer", "null"]
        activeCalories:
          type: ["integer", "null"]
        healthScore:
          type: integer
        workScore:
          type: integer
        relationshipScore:
          type: integer
        healthStatus:
          type: string
        workStatus:
          type: string
        relationshipStatus:
          type: string
        streak:
          type: integer
          description: Current consecutive-day streak (daily logs + voice debriefs)
        longestStreak:
          type: integer
          description: All-time longest consecutive-day streak

    StreakData:
      type: object
